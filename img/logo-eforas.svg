<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="EFORAS — symbole">
  <!-- Cercle fond gold avec contour blanc épais -->
  <circle cx="32" cy="32" r="29" fill="#D4A017" stroke="#fff" stroke-width="3"/>
  <!-- Cercle intérieur orbite (style globe Axxess) -->
  <ellipse cx="32" cy="32" rx="29" ry="11" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <ellipse cx="32" cy="32" rx="11" ry="29" fill="none" stroke="#fff" stroke-width="2" opacity="0.5" transform="rotate(20 32 32)"/>
  <!-- Courbe ascendante data en blanc (signature EFORAS = data trend) -->
  <path d="M 14 46 Q 22 38, 30 32 T 50 16"
        stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Point sommet (data point clé) en navy -->
  <circle cx="50" cy="16" r="3.5" fill="#1F3864" stroke="#fff" stroke-width="1.5"/>
  <circle cx="30" cy="32" r="2.8" fill="#1F3864" stroke="#fff" stroke-width="1.4"/>
</svg>
