<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="EFORAS">
  <defs>
    <radialGradient id="ef-sphere" cx="35%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#FFD24D"/>
      <stop offset="55%" stop-color="#E8B92A"/>
      <stop offset="100%" stop-color="#A87E11"/>
    </radialGradient>
  </defs>
  <!-- Sphère gold avec dégradé pour effet 3D -->
  <circle cx="32" cy="32" r="29" fill="url(#ef-sphere)"/>
  <!-- Anneaux croisés style globe Axxess (3 ellipses) -->
  <ellipse cx="32" cy="32" rx="29" ry="11"
           fill="none" stroke="#fff" stroke-width="3"
           transform="rotate(-20 32 32)"/>
  <ellipse cx="32" cy="32" rx="29" ry="11"
           fill="none" stroke="#fff" stroke-width="3"
           transform="rotate(35 32 32)"/>
  <ellipse cx="32" cy="32" rx="11" ry="29"
           fill="none" stroke="#fff" stroke-width="3"
           transform="rotate(15 32 32)"/>
  <!-- Highlight (reflet sur sphère) -->
  <ellipse cx="22" cy="20" rx="9" ry="6"
           fill="#fff" opacity="0.25" transform="rotate(-30 22 20)"/>
</svg>
